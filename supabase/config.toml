# Local Supabase (`supabase start`). Unlisted settings use the CLI defaults.
project_id = "mixi-fan-hub"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]

# Google is the only way in. Email/password sign-up stays off: it would let anyone
# register an address listed in admin_emails (the DB also requires a confirmed email).
[auth.email]
enable_signup = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = true
