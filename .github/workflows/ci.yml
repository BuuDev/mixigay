name: CI

on:
  pull_request:
  push:
    branches: [main, developer]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:check
      # Builds in Supabase mode against a local stub and probes every route anonymously.
      - run: npm run smoke
      # No Supabase env: the build uses mock data, which still exercises every page.
      - run: npm run build
